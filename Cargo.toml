[workspace]
resolver = "3"
members = ["protocol", "server", "fake-train"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
shotexpress-protocol = { path = "protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
rumqttc = "0.24"
futures = "0.3"
tracing = "0.1"
dotenvy = "0.15"
