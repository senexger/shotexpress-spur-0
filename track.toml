# ShotExpress track map

[train]
max_speed = 1.0               
start_speed = 0.2              # 4000 steps/s (1.0 = 20000 steps/s)
accel = 0.025                  # 500 steps/s²
max_run_ms_without_tag = 0     # 0 = off: no tag for a while never stops the train
default_ttl_ms = 60000

[refill]
station = "Tankstation"         # a station name, not a tag uid
steps = 1000
speed = 0.2
shot_ml = 8
max_shots = 6
nudge_wait_ms = 3000
auto_fill = false

# === STATIONS ===

[[station]]
name = "Tankstation"
tag = "04402852803C80"
role = "refill"

